<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070909" />
  <title>尸潮乱斗 / Horde Mayhem</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <link rel="stylesheet" href="./css/game.css" />
  <link rel="stylesheet" href="./css/shell.css">
</head>
<body class="game-page">
  <div id="game-root"></div>

  <div id="loading-screen" class="screen-layer loading-screen">
    <div class="loading-mark" data-i18n="name">DEAD SECTOR</div>
    <div class="loading-line"><span></span></div>
    <p data-i18n="loading">正在加载游戏...</p>
  </div>

  <div id="error-screen" class="screen-layer error-screen" hidden>
    <div class="error-card">
      <p class="eyebrow danger-text" data-i18n="error">游戏错误</p>
      <h2 data-i18n="startupError">无法启动游戏</h2>
      <p id="error-message">未知错误。</p>
      <a class="menu-button" href="./index.html" data-i18n="back">返回主菜单</a>
    </div>
  </div>

  <section id="hud" class="hud" aria-label="游戏状态界面" data-i18n-label="health">
    <div class="hud-block hud-left">
      <span class="hud-label" data-i18n="health">生命值</span>
      <div class="health-line"><span id="health-fill"></span></div>
      <strong id="health-text">100</strong>
    </div>

    <div class="hud-center">
      <span id="wave">波次 1</span>
      <strong id="score">得分 0000</strong>
      <small id="fps-display">90 FPS</small>
    </div>

    <div class="hud-block hud-right">
      <div><strong id="ammo">30</strong><span>/</span><span id="reserve">120</span></div>
      <small>AR-01</small>
    </div>
  </section>

  <div id="crosshair" class="crosshair" aria-hidden="true">
    <i></i><i></i><i></i><i></i><b></b>
  </div>
  <div id="hitmarker" class="hitmarker" aria-hidden="true">×</div>
  <div id="damage-overlay" class="damage-overlay"></div>
  <div id="kill-message" class="kill-message">+100</div>
  <div id="reload-message" class="reload-message">换弹中</div>

  <div id="enter-screen" class="screen-layer enter-screen" hidden>
    <div class="pause-card compact">
      <p class="eyebrow" data-i18n="name">DEAD SECTOR</p>
      <h2 data-i18n="ready">准备就绪</h2>
      <p data-i18n="enterHint">点击进入禁区</p>
      <button class="menu-button primary" id="enter-game" type="button" data-i18n="enter">进入游戏</button>
    </div>
  </div>

  <div id="pause-screen" class="screen-layer pause-screen" hidden>
    <div class="pause-card">
      <p class="eyebrow" data-i18n="paused">游戏已暂停</p>
      <h2 data-i18n="name">DEAD SECTOR</h2>
      <div class="pause-actions">
        <button class="menu-button primary" id="resume-game" type="button" data-i18n="resume">继续游戏</button>
        <button class="menu-button" type="button" data-open-settings data-i18n="settings">设置</button>
        <button class="menu-button danger-button" id="exit-game" type="button" data-i18n="exit">退出到主菜单</button>
      </div>
      <p class="pause-hint" data-i18n="pauseHint">按 ESC 打开 / 关闭菜单</p>
    </div>
  </div>

  <div id="game-over" class="screen-layer game-over" hidden>
    <div class="pause-card">
      <p class="eyebrow danger-text" data-i18n="signalLost">信号中断</p>
      <h2 data-i18n="dead">你已阵亡</h2>
      <p class="final-score-label" data-i18n="finalScore">最终得分</p>
      <strong id="final-score" class="final-score">0</strong>
      <div class="pause-actions">
        <button class="menu-button primary" id="restart-game" type="button" data-i18n="restart">重新开始</button>
        <a class="menu-button" href="./index.html" data-i18n="exit">退出到主菜单</a>
      </div>
    </div>
  </div>

  <dialog class="settings-dialog" id="settings-dialog">
    <form method="dialog" class="settings-panel" id="settings-form">
      <div class="panel-head">
        <div>
          <p class="eyebrow" data-i18n="system">系统</p>
          <h2 data-i18n="settings">设置</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭设置" data-i18n-label="close">×</button>
      </div>

      <label class="setting-row">
        <span><strong data-i18n="fps">帧率限制</strong><small data-i18n="fpsHint">36 / 40 / 90 / 120</small></span>
        <select id="fps-setting">
          <option value="30">30 FPS</option><option value="60">60 FPS</option>
          <option value="90">90 FPS</option>
          <option value="120">120 FPS</option><option value="144">144 FPS</option>
        </select>
      </label>

      <label class="setting-row range-row">
        <span><strong data-i18n="sensitivity">鼠标灵敏度</strong><small data-i18n="sensitivityHint">调整视角转动速度</small></span>
        <div class="range-control">
          <input id="sensitivity-setting" type="range" min="0.0015" max="0.006" step="0.0001" />
          <output id="sensitivity-value">0.0035</output>
        </div>
      </label>

      <label class="setting-row range-row">
        <span><strong data-i18n="volume">主音量</strong><small data-i18n="volumeHint">游戏音效音量</small></span>
        <div class="range-control">
          <input id="volume-setting" type="range" min="0" max="1" step="0.05" />
          <output id="volume-value">70%</output>
        </div>
      </label>

      <label class="setting-row"><span><strong data-i18n="language"></strong></span><select id="language-setting"><option value="zh">中文</option><option value="en">English</option></select></label>
      <label class="setting-row"><span><strong data-i18n="fov"></strong><small data-i18n="fovHint"></small></span><div class="range-control"><input id="fov-setting" type="range" min="70" max="110" step="1"><output id="fov-value">85°</output></div></label>
      <label class="setting-row"><span><strong data-i18n="adsMode"></strong></span><select id="ads-setting"><option value="toggle" data-i18n="toggle"></option><option value="hold" data-i18n="hold"></option></select></label>
      <label class="setting-row"><span><strong data-i18n="haptics"></strong></span><input id="haptics-setting" type="checkbox"></label>
<div class="panel-actions">
        <button class="menu-button" type="button" id="reset-settings" data-i18n="reset">重置</button>
        <button class="menu-button primary" type="submit" value="save" data-i18n="save">保存</button>
      </div>
    </form>
  </dialog>

  <script src="./js/config.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/network.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
